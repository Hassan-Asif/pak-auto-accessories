<!doctype html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    name="theme-color"
    content="#000000"
  />

  <meta
    name="description"
    content="Premium car accessories in Pakistan with WhatsApp confirmation before payment."
  />

  <link
    rel="icon"
    href="/logo yhacc.jpeg"
  />

  <title>NeonLEDs</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
    }

    #initial-loader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      visibility: visible;
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    #initial-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .loader-logo {
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1.5px;
    }

    .loader-logo span {
      color: #71717a;
    }

    .loader-spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #27272a;
      border-top-color: #fff;
      border-radius: 50%;
      animation: loader-spin 0.8s linear infinite;
    }

    .loader-text {
      color: #71717a;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    @keyframes loader-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

</head>

<body>

  <!-- Initial loading screen -->
  <div id="initial-loader">

    <div class="loader-content">

      <div class="loader-logo">
        Neon<span>LEDs</span>
      </div>

      <div class="loader-spinner"></div>

      <div class="loader-text">
        Loading
      </div>

    </div>

  </div>


  <!-- Vue application -->
  <div id="app"></div>


  <script type="module" src="/src/main.js"></script>

</body>

</html>
